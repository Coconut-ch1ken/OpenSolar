capability_capsule_id: cap.research-hypothesis-formulate
capsule_kind: capability
metadata:
  name: Hypothesis Formulate
  description: "Turn the accepted requirements and request context into explicit, testable research claims (hypotheses) with stated anchors, so experiment design can proceed from a user-stated claim without a literature corpus."
applicability:
  task_types:
    - scientific-research
    - experiment
    - claim-extraction
  positive_signals:
    - hypothesis formulate
  negative_signals:
    - render verdict table only
contract:
  inputs:
    required:
      - name: requirement_ir
        type: controller_input
        description: Accepted controller artifact.
      - name: request_context
        type: artifact.request_context
    optional: []
  outputs:
    required:
      - name: research_claims
        schema_ref: schemas/evidence/research_claims.v1.schema.json
    optional: []
  preconditions:
    - check: evidence_available
      description: Upstream controller or typed evidence exists.
  postconditions:
    - check: output_present
      field: research_claims
  invariants:
    - Every claim cites its source_anchor in the request or requirements; nothing is invented.
    - Claims are marked unverified at formulation; testability is stated honestly.
composition:
  consumes:
    - type: requirement_ir.v1
    - type: artifact.request_context
  produces:
    - schema_ref: schemas/evidence/research_claims.v1.schema.json
  compatible_with: []
  incompatible_with: []
  requires_after:
    []
effects:
  read:
    - accepted requirements and typed evidence
  write:
    - artifacts/scientific/research_claims/
  execute:
    []
  network:
    - none by default
  cost:
    - premium_model_quota
  risk:
    - a stated claim can be formulated too broadly to be testable
implementation:
  trust_class: evidence_transform
  reasoning: model
bindings:
  skills:
    required: []
    optional: []
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against the declared output contract.
  external_verifier:
    required: true
  pass_conditions:
    - check.scientific.research_claims.v1 passes on the emitted evidence.
    - Each formulated claim anchors to requirement ids or request text.
operator_compatibility:
  preferred:
    - mini-codex-gpt55-medium-builder-1
    - mini-claude-sonnet-builder-2
    - mini-codex-gpt53-spark-builder-1
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: research_verification_capsules
