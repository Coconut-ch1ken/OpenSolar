capability_capsule_id: cap.scientific-report-deliver
capsule_kind: capability
metadata:
  name: Scientific Report Deliver
  description: "Render an accepted scientific_report.v1 evidence artifact into the user-facing final deliverable report (artifact.report) with sections, evidence ids, unsupported claims and limitations preserved verbatim."
applicability:
  task_types:
    - scientific-research
    - report-drafting
    - report-writing
  positive_signals:
    - scientific report deliver
  negative_signals:
    - render verdict table only
contract:
  inputs:
    required:
      - name: scientific_report
        schema_ref: schemas/evidence/scientific_report.v1.schema.json
    optional: []
  outputs:
    required:
      - name: report
        type: artifact.report
    optional: []
  preconditions:
    - check: evidence_available
      description: Upstream controller or typed evidence exists.
  postconditions:
    - check: output_present
      field: report
  invariants:
    - The deliverable adds no claim absent from the scientific_report evidence; unsupported_claims and limitations are carried verbatim.
composition:
  consumes:
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
  produces:
    - type: artifact.report
  compatible_with: []
  incompatible_with: []
  requires_after:
    - cap.scientific-report-synthesize
effects:
  read:
    - accepted requirements and typed evidence
  write:
    - artifacts/scientific/report/
  execute:
    []
  network:
    - none by default
  cost:
    - premium_model_quota
  risk:
    - a stated claim can be formulated too broadly to be testable
implementation:
  trust_class: evidence_transform
  reasoning: model
bindings:
  skills:
    required: []
    optional: []
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against the declared output contract.
  external_verifier:
    required: true
  pass_conditions:
    - The rendered report cites the same evidence ids as the scientific_report evidence.
    - Unsupported claims and limitations appear in the deliverable.
operator_compatibility:
  preferred:
    - mini-codex-gpt55-medium-builder-1
    - mini-claude-sonnet-builder-2
    - mini-codex-gpt53-spark-builder-1
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: research_verification_capsules
