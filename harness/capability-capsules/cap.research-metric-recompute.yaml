capability_capsule_id: cap.research-metric-recompute
capsule_kind: capability
metadata:
  name: Metric Recompute
  description: "Independently recompute every reported experiment metric from the retained result artifacts and state agreement or discrepancy per metric."
applicability:
  task_types:
    - scientific-research
    - experiment
    - metric-recomputation
  positive_signals:
    - metric recompute
  negative_signals:
    - render verdict table only
contract:
  inputs:
    required:
      - name: experiment_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
    optional: []
  outputs:
    required:
      - name: metric_recomputation
        schema_ref: schemas/evidence/metric_recomputation.v1.schema.json
    optional: []
  preconditions:
    - check: evidence_available
      description: Typed upstream evidence exists.
  postconditions:
    - check: output_present
      field: metric_recomputation
  invariants:
    - Recomputation reads only hash-pinned artifacts listed in recomputed_from.
    - A metric that cannot be recomputed is labelled not_recomputable, never copied as matching.
composition:
  consumes:
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
  produces:
    - schema_ref: schemas/evidence/metric_recomputation.v1.schema.json
  compatible_with: []
  incompatible_with: []
  requires_after:
    - cap.research-experiment-run
effects:
  read:
    - typed scientific evidence
  write:
    - artifacts/scientific/metric_recomputation/
  execute:
    - bounded local commands inside the node write scope
  network:
    # The bound builder's provider call is runtime infrastructure, not a task
    # network effect; retrieval capsules declare network, writers do not.
    - none by default
  cost:
    - premium_model_quota
  risk:
    - unverified numbers can be presented as recomputed
implementation:
  trust_class: evidence_transform
  reasoning: model
bindings:
  skills:
    required: []
    optional: []
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/metric_recomputation.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against schemas/evidence/metric_recomputation.v1.schema.json.
  external_verifier:
    required: true
  pass_conditions:
    - check.scientific.metric_recomputation.v1 passes on the emitted evidence.
    - Every differing metric is explained in discrepancies or limitations.
operator_compatibility:
  preferred:
    - mini-codex-gpt55-medium-builder-1
    - mini-claude-sonnet-builder-2
    - mini-codex-gpt53-spark-builder-1
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: research_verification_capsules
