capability_capsule_id: cap.research-claim-verify-experimental
capsule_kind: capability
metadata:
  name: Claim Verify Experimental
  description: "Verify formulated claims against measured experiment results and independent metric recomputation, producing per-claim verdicts without requiring a paper corpus."
applicability:
  task_types:
    - scientific-research
    - experiment
    - claim-verification
  positive_signals:
    - claim verify experimental
  negative_signals:
    - render verdict table only
contract:
  inputs:
    required:
      - name: research_claims
        schema_ref: schemas/evidence/research_claims.v1.schema.json
      - name: experiment_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
      - name: metric_recomputation
        schema_ref: schemas/evidence/metric_recomputation.v1.schema.json
    optional: []
  outputs:
    required:
      - name: claim_verdict
        schema_ref: schemas/evidence/claim_verdict.v1.schema.json
    optional: []
  preconditions:
    - check: evidence_available
      description: Upstream controller or typed evidence exists.
  postconditions:
    - check: output_present
      field: claim_verdict
  invariants:
    - Verdicts cite experiment evidence ids; unsupported claims stay unsupported.
    - A measured claim is never marked supported without an independent metric recomputation that agrees.
composition:
  consumes:
    - schema_ref: schemas/evidence/research_claims.v1.schema.json
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
    - schema_ref: schemas/evidence/metric_recomputation.v1.schema.json
  produces:
    - schema_ref: schemas/evidence/claim_verdict.v1.schema.json
  compatible_with: []
  incompatible_with: []
  requires_after:
    - cap.research-experiment-run
    - cap.research-metric-recompute
effects:
  read:
    - accepted requirements and typed evidence
  write:
    - artifacts/scientific/claim_verdict/
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/delivery.py
  network:
    - none by default
  cost:
    - premium_model_quota
  risk:
    - a stated claim can be formulated too broadly to be testable
implementation:
  trust_class: evidence_transform
  reasoning: deterministic
bindings:
  skills:
    required: []
    optional: []
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against the declared output contract.
  external_verifier:
    required: true
  pass_conditions:
    - check.scientific.claim_verdict.v1 passes on the emitted evidence.
operator_compatibility:
  preferred:
    - claim_verify_worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: research_verification_capsules
